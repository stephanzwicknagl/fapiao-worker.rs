[package]
name = "fapiao-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = {version = "0.4.3", features = ["wasm_js"]}
thiserror = "2.0.18"
regex = "1.13.1"
umya-spreadsheet = "3.1.0"
pdf_oxide = { version = "0.3.77", default-features = false }
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
log = "0.4"
console_log = "1.0"

[profile.dev]
opt-level = 1
incremental = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# rustc >= 1.87 emits post-MVP wasm instructions (bulk-memory etc.) by default,
# but wasm-bindgen strips the target-features section, so wasm-opt must be told
# explicitly which features to allow. These replace wasm-pack's default ["-O"].
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-multivalue",
  "--enable-reference-types",
  "--enable-extended-const",
]
