[package]
name = "fapiao-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
lopdf = "0.44.0"
getrandom = {version = "0.4.3", features = ["wasm_js"]}
thiserror = "2.0.18"
regex = "1.13.1"
umya-spreadsheet = "3.1.0"
pdf_oxide = "0.3.77"
jiff = "0.2.35"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1
incremental = true
